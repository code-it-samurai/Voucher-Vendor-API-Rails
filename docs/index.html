<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voucher Vendor API</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Gift Card Order Service — Rails API demonstrating idempotency, concurrency safety, and background job processing">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --theme-color: #a78bfa;
      --sidebar-width: 260px;
      --sidebar-background: #0f0f0f;
      --sidebar-border-color: #1e1e1e;
      --sidebar-nav-link-color: #a0a0a0;
      --sidebar-nav-link-color--active: #a78bfa;
      --sidebar-nav-link-border-color--active: #a78bfa;
      --sidebar-name-color: #e0e0e0;

      --base-background-color: #000000;
      --base-color: #d4d4d4;

      --heading-color: #f0f0f0;
      --heading-h1-border-color: #2a2a2a;
      --heading-h2-color: #c4b5fd;

      --code-theme-background: #1a1a2e;
      --code-theme-text: #e2e8f0;
      --code-inline-background: #1e1e2e;
      --code-inline-color: #c4b5fd;

      --blockquote-border-color: #a78bfa;
      --blockquote-background: #1a1a1a;

      --table-head-background: #1a1a1a;
      --table-head-color: #e0e0e0;
      --table-body-border-color: #2a2a2a;
      --table-row-even-background: #151515;
      --table-row-odd-background: #111111;

      --link-color: #a78bfa;
      --link-color--hover: #c4b5fd;

      --cover-background-color: #0a0a0a;
      --cover-heading-color: #f0f0f0;
      --cover-color: #a0a0a0;
      --cover-button-background: transparent;
      --cover-button-color: #a78bfa;
      --cover-button-border: 1px solid #a78bfa;

      --notice-tip-border-color: #a78bfa;
      --search-background: #1a1a1a;
      --search-input-color: #e0e0e0;
    }

    body, html {
      background: #000000;
    }

    /* Sidebar */
    .sidebar-nav > ul > li > a {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75em;
      letter-spacing: 0.05em;
      color: #666 !important;
      pointer-events: none;
    }
    .sidebar-nav > ul > li > ul > li > a {
      font-weight: 400;
      text-transform: none;
      font-size: 0.9em;
      letter-spacing: normal;
      color: #a0a0a0 !important;
      pointer-events: auto;
    }
    .sidebar-nav > ul > li > ul > li > a:hover,
    .sidebar-nav > ul > li > ul > li > a.active {
      color: #a78bfa !important;
    }

    /* Content */
    .markdown-section h1 {
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 0.4em;
      font-weight: 700;
    }
    .markdown-section h2 {
      margin-top: 2.5em;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }
    .markdown-section table th,
    .markdown-section table td {
      border: 1px solid #2a2a2a;
      padding: 8px 12px;
    }
    .markdown-section table th {
      background: #1a1a1a;
      font-weight: 600;
    }
    .markdown-section hr {
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 3em 0;
    }
    .markdown-section code {
      border-radius: 4px;
    }
    .markdown-section pre {
      border-radius: 8px;
      border: 1px solid #1e1e1e;
    }

    /* Cover page — pitch black, no gradient */
    section.cover {
      background: #000000 !important;
      background-image: none !important;
      overflow: hidden;
    }
    section.cover::before,
    section.cover::after {
      background: none !important;
      background-image: none !important;
      display: none !important;
    }
    section.cover .mask {
      background: #000000 !important;
      background-image: none !important;
      opacity: 1 !important;
    }
    section.cover .cover-main {
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
      padding: 0 1.5em;
      box-sizing: border-box;
    }
    section.cover h1 {
      font-size: 3.5em;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0;
      letter-spacing: -0.02em;
    }
    section.cover p {
      color: #888888;
    }
    section.cover pre {
      background: #0a0a0a !important;
      border: 1px solid #1a1a1a !important;
      border-radius: 8px;
      padding: 1.2em 1.4em !important;
      margin: 0 !important;
    }
    /* Hide the plugin copy button on cover — we use our own */
    section.cover .docsify-copy-code-button {
      display: none !important;
    }
    /* Cover buttons */
    section.cover .cover-main > p:last-child {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 2.5em;
    }
    section.cover .cover-main > p:last-child a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      color: #bbbbbb !important;
      border-radius: 8px;
      padding: 0.55em 1.3em;
      text-decoration: none;
      font-size: 0.82em;
      font-weight: 500;
      transition: all 0.25s ease;
      background: transparent;
      white-space: nowrap;
    }
    section.cover .cover-main > p:last-child a:first-child {
      background: #ffffff;
      color: #000000 !important;
      border-color: #ffffff;
      font-weight: 600;
    }
    section.cover .cover-main > p:last-child a:hover {
      border-color: #888;
      color: #ffffff !important;
      transform: translateY(-1px);
    }
    section.cover .cover-main > p:last-child a:first-child:hover {
      background: #e0e0e0;
      color: #000000 !important;
    }

    /* Mermaid dark theme overrides */
    .mermaid {
      background: transparent !important;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Voucher Vendor API',
      // repo link removed — Github Repo button on coverpage instead
      loadSidebar: true,
      coverpage: true,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied!'
      },
      tabs: {
        persist: true,
        sync: false
      }
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-ruby.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  </script>

  <!-- Tabs plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

</body>
</html>
